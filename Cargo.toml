[package]
name = "ikat"
version = "0.2.2"
edition = "2021"
description = "Weave Markdown into camera-ready LaTeX: mermaid-to-TikZ, pgfplots figures, publisher templates"
authors = ["opticsWolf"]
homepage = "https://opticsWolf.github.io/ikat/"
repository = "https://github.com/opticsWolf/ikat"
license = "MIT OR Apache-2.0"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tectonic = { version = "0.17.0", optional = true }
toml = "1"

[dev-dependencies]
pulldown-cmark = "0.13.4"

[features]
tectonic = ["dep:tectonic"]
