[package]
name = "ikat"
version = "0.11.2"
edition = "2021"
description = "Weave Markdown into camera-ready LaTeX: mermaid-to-TikZ, pgfplots figures, publisher templates"
authors = ["opticsWolf"]
homepage = "https://opticsWolf.github.io/ikat/"
repository = "https://github.com/opticsWolf/ikat"
license = "MIT OR Apache-2.0"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
# Block splitter since E.1 (M5.4): 0.13.x pinned — parser version
# bumps are their own commits with a golden re-run.
pulldown-cmark = "0.13"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]

[features]
# Linux-only by design: the tectonic crate builds its C/C++ XeTeX
# core through pkg-config, which has no answer where no system C
# libraries exist (Windows/macOS defaults). Elsewhere the binary
# cascade covers tectonic (TECTONIC_EXE or PATH).
tectonic = ["dep:tectonic"]

[target.'cfg(target_os = "linux")'.dependencies]
tectonic = { version = "0.17.0", optional = true }
