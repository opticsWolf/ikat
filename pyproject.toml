[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ikat"
version = "0.1.0"
description = "Weave Markdown into camera-ready LaTeX: md-to-tex/pdf pipeline with a Rust core (mermaid-to-TikZ, pgfplots figures)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "opticsWolf" }]
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "ikat._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
