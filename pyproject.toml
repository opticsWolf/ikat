[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ikat"
version = "0.7.1"
description = "Weave Markdown into camera-ready LaTeX: md-to-tex/pdf pipeline with a Rust core (mermaid-to-TikZ, pgfplots figures)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "opticsWolf" }]
license = { text = "MIT OR Apache-2.0" }
urls = { Homepage = "https://opticsWolf.github.io/ikat/", Repository = "https://github.com/opticsWolf/ikat" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1,<2"]

[project.scripts]
ikat = "ikat.cli:main"

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "ikat._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
